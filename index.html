<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direktori Grup WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wa: '#25D366',
                        waDark: '#128C7E',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #25D366;
            border-radius: 50%; width: 24px; height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkBg dark:text-gray-100 transition-colors duration-300 min-h-screen font-sans">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-wa to-waDark bg-clip-text text-transparent">
                WA Groups
            </h1>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                🌙
            </button>
        </div>
        
        <!-- Search Bar -->
        <div class="max-w-md mx-auto px-4 pb-3">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Cari grup..." 
                    class="w-full pl-10 pr-4 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 border-none focus:ring-2 focus:ring-wa outline-none transition text-sm">
                <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 py-6 pb-24 space-y-6" id="app">
        <!-- Loading State -->
        <div id="loading" class="flex justify-center py-10">
            <div class="loader"></div>
        </div>
        <!-- Content will be injected here -->
    </main>

    <!-- Bottom Sheet Modal (Hidden by default) -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
    <div id="bottomSheet" class="fixed bottom-0 left-0 right-0 bg-white dark:bg-darkCard rounded-t-3xl z-50 transform translate-y-full transition-transform duration-300 max-w-md mx-auto shadow-2xl overflow-hidden">
        <div class="p-6">
            <div class="w-12 h-1 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
            <div class="flex items-center gap-4 mb-4">
                <div id="modalIcon" class="text-4xl bg-gray-100 dark:bg-gray-800 p-3 rounded-2xl"></div>
                <div>
                    <h3 id="modalTitle" class="font-bold text-lg leading-tight"></h3>
                    <p id="modalCategory" class="text-xs text-wa font-semibold uppercase tracking-wide mt-1"></p>
                </div>
            </div>
            <p id="modalDesc" class="text-sm text-gray-600 dark:text-gray-400 mb-6 leading-relaxed"></p>
            
            <!-- CAPTCHA Section -->
            <div id="captchaSection" class="mb-4 bg-gray-50 dark:bg-gray-800 p-3 rounded-xl border border-gray-200 dark:border-gray-700">
                <p class="text-xs text-center mb-2 font-medium">Verifikasi Manusia</p>
                <div class="flex items-center justify-between gap-2">
                    <span id="captchaQuestion" class="font-mono text-lg font-bold text-waDark"></span>
                    <input type="number" id="captchaInput" class="w-20 text-center bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg py-1 outline-none focus:border-wa" placeholder="?">
                </div>
                <p id="captchaError" class="text-red-500 text-xs mt-1 hidden">Salah! Coba lagi.</p>
            </div>

            <!-- Action Button -->
            <button id="actionBtn" disabled 
                class="w-full bg-gray-300 dark:bg-gray-700 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all duration-300 cursor-not-allowed">
                <span id="btnText">Memverifikasi...</span>
            </button>
            
            <div class="mt-4 flex gap-2">
                <button onclick="copyInvite()" class="flex-1 py-2 text-xs font-medium text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    📋 Copy Invite
                </button>
                <button onclick="shareGroup()" class="flex-1 py-2 text-xs font-medium text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    🔗 Share
                </button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Trigger -->
    <button id="adminTrigger" class="fixed top-4 right-4 z-30 bg-gray-800 text-white p-2 rounded-full shadow-lg hidden hover:scale-110 transition" onclick="toggleAdminPanel()">
        ⚙️
    </button>

    <!-- Admin Panel Modal -->
    <div id="adminPanel" class="fixed inset-0 bg-white dark:bg-darkBg z-[60] hidden overflow-y-auto">
        <div class="max-w-md mx-auto p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Admin Panel</h2>
                <button onclick="toggleAdminPanel()" class="text-red-500 font-bold">Close</button>
            </div>
            
            <div class="space-y-4">
                <button onclick="openEditor()" class="w-full bg-wa text-white py-3 rounded-xl font-bold shadow-lg hover:bg-waDark transition">+ Tambah Grup Baru</button>
                
                <div class="bg-yellow-50 dark:bg-yellow-900/20 p-4 rounded-xl border border-yellow-200 dark:border-yellow-800">
                    <h3 class="font-bold text-yellow-800 dark:text-yellow-500 mb-2">Cara Update:</h3>
                    <ol class="list-decimal list-inside text-sm text-yellow-700 dark:text-yellow-400 space-y-1">
                        <li>Edit atau Hapus grup di list bawah.</li>
                        <li>Klik "Simpan & Generate JSON".</li>
                        <li>Copy hasil JSON yang muncul.</li>
                        <li>Paste ke file <code>groups.json</code> di GitHub.</li>
                    </ol>
                </div>

                <div id="adminList" class="space-y-3"></div>
                
                <textarea id="jsonOutput" class="w-full h-32 bg-gray-900 text-green-400 font-mono text-xs p-3 rounded-xl mt-4" readonly placeholder="Hasil JSON akan muncul di sini..."></textarea>
                <button onclick="copyJsonResult()" class="w-full bg-gray-800 text-white py-2 rounded-lg text-sm font-bold">📋 Copy JSON Result</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-400 dark:text-gray-600">
        <p>&copy; 2024 Direktori Grup WA</p>
        <p id="adminLoginHint" class="mt-2 cursor-pointer select-none">Admin Login</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
